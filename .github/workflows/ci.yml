name: CI

on:
  # Every PR, whatever its base: stacked PRs (base = another feature branch) need the same checks,
  # and a retarget to main after the parent merges does not fire a new run (D-029 merge train).
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs: one per PR ref; a new push cancels the older PR run.
  # Push runs: keyed by sha, so main runs are never cancelled or dropped.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Secret scan
        run: node scripts/nightly-audit.mjs --secrets-only

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Docs-only PRs (every changed file is under docs/ or ends in .md) skip
      # the Supabase, database and e2e steps. The job still reports, so the
      # required ci check stays. Pushes to main always run everything.
      - name: Detect docs-only change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"
            echo "$changed"
            other="$(printf '%s\n' "$changed" | grep -v -E '^docs/|\.md$' | grep -v '^$' || true)"
            if [ -n "$changed" ] && [ -z "$other" ]; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Setup Supabase CLI
        if: steps.scope.outputs.docs_only != 'true'
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.120.0

      - name: Start local Supabase
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          # The step shell runs with -e, so capture the exit code inline or nothing below runs on failure.
          status=0
          supabase start > /tmp/supabase-start.log 2>&1 || status=$?
          awk 'BEGIN{IGNORECASE=1} /migrat|seed/' /tmp/supabase-start.log
          if [ "$status" != 0 ]; then echo "::group::supabase start log (failed)"; tail -n 80 /tmp/supabase-start.log; echo "::endgroup::"; fi
          exit $status

      - name: Database tests
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:db

      - name: Install Playwright Chromium
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Write local Next.js env
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          eval "$(supabase status -o env)"
          umask 077
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$ANON_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SERVICE_ROLE_KEY"
          } > .env.local

      - name: E2E smoke
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test:e2e
