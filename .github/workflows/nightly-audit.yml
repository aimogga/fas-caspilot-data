name: Nightly Audit

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly-audit.yml'
      - '.github/workflows/audit-staleness.yml'
      - 'scripts/nightly-audit.mjs'
      - 'scripts/nightly-audit.test.mjs'
      - 'scripts/audit-staleness.mjs'
      - 'scripts/audit-staleness.test.mjs'
      - 'package.json'
      - 'harness/audit-ignores.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run nightly audit
        id: audit
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "audit_date=$DATE" >> $GITHUB_OUTPUT
          EXIT_CODE=0
          node scripts/nightly-audit.mjs > audit-output.txt 2>&1 || EXIT_CODE=$?
          cat audit-output.txt
          if [ -f "harness/audits/${DATE}.md" ]; then
            echo "----- harness/audits/${DATE}.md -----"
            cat "harness/audits/${DATE}.md"
          fi
          exit $EXIT_CODE
      
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-${{ steps.audit.outputs.audit_date }}
          path: |
            audit-output.txt
            harness/audits/${{ steps.audit.outputs.audit_date }}.md
          retention-days: 90
      
      - name: Generate job summary
        if: always()
        run: |
          if [ -f "harness/audits/${{ steps.audit.outputs.audit_date }}.md" ]; then
            cat "harness/audits/${{ steps.audit.outputs.audit_date }}.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Audit report not generated" >> $GITHUB_STEP_SUMMARY
            [ -f "audit-output.txt" ] && { echo "" >> $GITHUB_STEP_SUMMARY; echo "### Audit Output" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; cat audit-output.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; }
          fi
